name: Feature request
description: Suggest a new capability or a change to the API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why the current API does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you have in mind, and alternatives you considered.
