name: Docs

# The docs describe the published package, so release.yml deploys them from
# each release commit. To redeploy, dispatch this from main with a release tag
# such as xstate-otel-v0.1.0 as the ref.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build the docs from
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build the docs from
        required: true
        type: string

permissions: {}

# Queue instead of cancelling, so a Pages deployment is never cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm run docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
          DOCS_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
