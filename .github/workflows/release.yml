name: Release

on:
  push:
    branches: [main]

permissions: {}

# Queue instead of cancelling: a superseded run may be mid-publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/xstate-otel--release_created'] }}
      release_sha: ${{ steps.release.outputs['packages/xstate-otel--sha'] }}
      release_version: ${{ steps.release.outputs['packages/xstate-otel--version'] }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Pushes made with GITHUB_TOKEN start no workflows, so start CI and the
  # title check on the release PR's branch to give it the required checks.
  release-pr-ci:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - run: gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f pr="$PR"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      # release-please finds merged release PRs on its own, so the release can
      # belong to another commit than the push that started this run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true # cache stays off: no caches in release builds
      - run: pnpm --filter @actorium/xstate-otel run check:package
      - id: version
        name: Check the version to publish
        working-directory: packages/xstate-otel
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$version" != "$RELEASE_VERSION" ]; then
            echo "::error::Checked-out version $version does not match release $RELEASE_VERSION"
            exit 1
          fi
          if [ -n "$(pnpm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif ! pnpm view "$name" name > /dev/null 2>&1; then
            echo "::error::$name is not on npm yet. npm accepts a trusted publisher only for an existing package, so publish the first version by hand."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # pnpm publish replaces catalog: and workspace: specifiers, builds through
      # prepack and authenticates through trusted publishing (OIDC). The
      # release commit is checked out detached, so skip the branch checks.
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/xstate-otel
        run: pnpm publish --no-git-checks --provenance

  # After publishing, so the docs never describe a version npm does not have.
  docs:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release-please.outputs.release_sha }}
