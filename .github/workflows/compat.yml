name: Compatibility

on:
  pull_request:
    paths:
      - packages/xstate-otel/**
      - scripts/workspace.mjs
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/compat.yml
  push:
    branches: [main]
    paths:
      - packages/xstate-otel/**
      - scripts/workspace.mjs
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/compat.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: xstate ${{ matrix.xstate }} × api ${{ matrix.api }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Row labels of packages/xstate-otel/scripts/check-compatibility.mjs.
      matrix:
        xstate: ['5.33.0', pinned, latest]
        api: ['1.9.0', latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run test:compatibility --xstate "$XSTATE" --api "$API"
        env:
          XSTATE: ${{ matrix.xstate }}
          API: ${{ matrix.api }}

  # A failed scheduled run notifies only whoever last edited the cron, so
  # report it in one issue that later failures comment on.
  report:
    needs: matrix
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Scheduled compatibility check failed
    steps:
      - run: |
          body="The scheduled compatibility check failed: $RUN_URL"
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
