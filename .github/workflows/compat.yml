name: Compatibility

on:
  pull_request:
    paths:
      - packages/xstate-otel/**
      - scripts/workspace.mjs
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/compat.yml
  push:
    branches: [main]
    paths:
      - packages/xstate-otel/**
      - scripts/workspace.mjs
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/compat.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: xstate ${{ matrix.xstate }} × api ${{ matrix.api }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Row labels of packages/xstate-otel/scripts/check-compatibility.mjs.
      matrix:
        xstate: ['5.33.0', '5.33.2', latest]
        api: ['1.9.0', latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run test:compatibility --xstate "$XSTATE" --api "$API"
        env:
          XSTATE: ${{ matrix.xstate }}
          API: ${{ matrix.api }}
